name: One-Time Clean Posts Collection

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE_POSTS to confirm permanent deletion'
        required: true
      mongodb_db:
        description: 'MongoDB database name'
        required: true
        default: 'roj-kuch-naya'

jobs:
  clean-database:
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation phrase
        if: ${{ inputs.confirm != 'DELETE_POSTS' }}
        run: |
          echo "Confirmation mismatch. Refusing to run cleanup."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run one-time posts cleanup
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ inputs.mongodb_db }}
        run: npm run clean:db
