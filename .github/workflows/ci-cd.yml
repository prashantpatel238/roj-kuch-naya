name: CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  statuses: write


jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build

      - name: Run AI content automation script
        id: ai_generate
        continue-on-error: true
        run: npx ts-node scripts/autoGenerate.ts

      - name: Log AI generation failure (non-blocking)
        if: steps.ai_generate.outcome == 'failure'
        run: |
          echo "AI automation script failed, but workflow will continue."
          echo "Please check script logs above for details."

  deploy-to-vercel:
    runs-on: ubuntu-latest
    needs: build-and-generate
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: BetaHuhn/deploy-to-vercel-action@v1
        with:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PRODUCTION: true
